name: auth-ui
domain: auth
version: 0.1.0
publisher: stuff8
status: unverified
license: mit
summary: "White-label signin/signup pages for the auth domain (Leptos SSR)"

targets:
  - linux/amd64
  - darwin/aarch64
  - darwin/aarch64

artifacts:
  linux/amd64:
    path: linux-amd64/auth-ui
    sha256: ffc6435f6d344505ad47c9843e39d75038513424326dad6817279b8d3f5d3d20
    size: 1313600
  darwin/aarch64:
    path: darwin-aarch64/auth-ui
    sha256: 5c034bfbd1b8350708c87b1c04add5622c27f91bc67c47c123de74070e4a595c
    size: 1133008

contract:
  version: 1
  api: "auth-ui pages: GET /signin, GET /signup"
  env:
    required:
      - SERVER_PORT
    optional:
      - AUTH_API_BASE
      - AUTH_REDIRECT_URL
  db: "none"
  network:
    inbound: [http]
    outbound: [http]
  resources:
    memory: "32m"
    disk: "32m"
    startup_seconds: 5

runtime:
  base: self-contained-static
  libc: musl
  dependencies: []

provenance:
  source: ""
  commit: ""
  built_by: ""
  built_at: ""
  target: x86_64-unknown-linux-musl

release: []
