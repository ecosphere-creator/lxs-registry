name: auth-ui
domain: auth
version: 3.1.0
publisher: stuff8
status: unverified
license: mit
summary: White-label signin, signup, and password recovery pages for the auth domain (Leptos SSR)
targets:
- darwin/arm64
- linux/amd64
artifacts:
  darwin/arm64:
    path: darwin-arm64/auth-ui
    sha256: 69ffa32ae29ea01300004df56cf2362fbf9caf6b5c1d56437e4fdb7ea3f20df5
    size: 2872032
  linux/amd64:
    path: linux-amd64/auth-ui
    sha256: cb00642d7e8ea2cb663538b397bb4f03eda61f21828a5d0650fc6e643a28d6c4
    size: 2066960
contract:
  version: 1
  api: 'auth-ui pages: GET /signin, GET /signup, GET /forgot-password, GET /reset-password'
  env:
    required:
    - SERVER_PORT
    optional:
    - AUTH_API_BASE
    - AUTH_REDIRECT_URL
    defaults: {}
    fields: {}
  db: none
  network:
    inbound:
    - http
    outbound:
    - http
  resources:
    memory: 32m
    disk: 32m
    startup_seconds: 5
runtime:
  base: self-contained-static
  libc: musl
  dependencies: []
provenance:
  source: https://github.com/getecosphere/auth-ui.git
  commit: 711e3d1ac0836c22e545bc4f05c543f8dd13426a
  built_by: eco@0.4.1
  built_at: 2026-08-22T21:14:32Z
  target: x86_64-unknown-linux-musl
release:
- 3.1.0
docs:
- README.md
- api.md
- changelog.md
- gotchas.md
compose:
  service:
    name: auth-ui
    port: 4201
    grants:
      secrets: []
    config: {}
    access:
      routes:
      - path: /signin
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
      - path: /signup
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
      - path: /forgot-password
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
      - path: /reset-password
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
      - path: /verify-email
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
      - path: /static/auth-ui.css
        level: public
        strip: ''
        rewrite: ''
        cookie: ''
  auth:
    email_verification:
      enabled: null
