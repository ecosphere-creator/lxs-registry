name: auth
domain: auth
version: 1.0.0
publisher: stuff8
status: unverified
license: mit
summary: "Authentication: login, register, JWT, email verification, avatars"

targets:
  - linux/amd64

artifacts:
  linux/amd64:
    path: linux-amd64/auth
    sha256: ""
    size: 0

contract:
  version: 1
  api: "auth REST API"
  env:
    required:
      - JWT_SECRET
      - MONGODB_URI
      - SERVER_PORT
    optional:
      - JWT_EXPIRATION
      - CORS_ALLOWED_ORIGINS
      - EMAIL_VERIFICATION_REQUIRED
      - BREVO_API_KEY
      - MAIL_FROM_EMAIL
      - MAIL_FROM_NAME
      - STORAGE_BACKEND
      - S3_ENDPOINT
      - S3_REGION
      - S3_BUCKET
      - S3_ACCESS_KEY
      - S3_SECRET_KEY
  db: mongodb@7
  network:
    inbound: [http]
    outbound: []
  resources:
    memory: "128m"
    disk: "256m"
    startup_seconds: 5

runtime:
  base: self-contained-static
  libc: musl
  dependencies: []

provenance:
  source: git@github-kelastanpatembok:kelastanpatembok/auth.git
  commit: ""
  built_by: eco@0.2.0
  built_at: ""
  target: x86_64-unknown-linux-musl

release:
  - 1.0.0
