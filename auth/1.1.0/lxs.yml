name: auth
domain: auth
version: 1.1.0
publisher: stuff8
status: unverified
license: mit
summary: "Authentication: login, register, JWT, email verification"

targets:
- linux/amd64
- darwin/aarch64

artifacts:
  linux/amd64:
    path: linux-amd64/auth
    sha256: 0aa85a54fbbace473163400cf3be5eb5ec7bc7066180bf161f778caeb4b57cea
    size: 11259440
  darwin/aarch64:
    path: darwin-aarch64/auth
    sha256: c05cd74e2489539e78ca94e1c83cd55fd7ae36e3a5b76249115d47e7f5cec35b
    size: 9825408

contract:
  version: 1
  api: "auth REST API"
  env:
    required:
      - JWT_SECRET
      - MONGODB_URI
      - SERVER_PORT
    optional:
      - JWT_EXPIRATION
      - API_BASE_URL
      - CORS_ALLOWED_ORIGINS
      - RATE_LIMIT_GENERAL_BURST
      - RATE_LIMIT_GENERAL_REPLENISH_SECS
      - RATE_LIMIT_AUTH_BURST
      - RATE_LIMIT_AUTH_REPLENISH_SECS
      - EMAIL_VERIFICATION_REQUIRED
      - EMAIL_VERIFICATION_TTL_HOURS
      - BREVO_API_KEY
      - MAIL_FROM_EMAIL
      - MAIL_FROM_NAME
  db: mongodb@7
  network:
    inbound: [http]
    outbound: [https]
  resources:
    memory: "64m"
    disk: "128m"
    startup_seconds: 5

runtime:
  base: self-contained-static
  libc: musl
  dependencies: []

provenance:
  source: ""
  commit: ""
  built_by: ""
  built_at: ""
  target: x86_64-unknown-linux-musl

release: []
