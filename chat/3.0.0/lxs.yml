    - SERVER_PORT
    - API_BASE_PATH
    - MONGODB_URI
    - REDIS_URL
    - JWT_SECRET
    optional:
    - STORAGE_API_URL
    - NOTIFICATIONS_API_URL
    - AUTH_BASE_URL
