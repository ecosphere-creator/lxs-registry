name: chat
domain: chat
version: 3.0.0
publisher: stuff8
status: unverified
license: mit
summary: 'Chat: realtime messaging via WebSocket, presence, Redis pub/sub'
targets:
- darwin/arm64
- linux/amd64
artifacts:
  darwin/arm64:
    path: darwin-arm64/chat
    sha256: cd3950e81de75415129b4c41b78188b79c7f272495fdb96a9b116f74615a6f09
    size: 17575984
  linux/amd64:
    path: linux-amd64/chat
    sha256: 80da99d5a7f5af552f49702919ae2632b502c59bdf5859d9e98f405276e704de
