name: ecobook
domain: ecobook
version: 1.0.0
publisher: getecosphere
status: unverified
license: mit
summary: Ecobook — a reusable portrait book reader (Phaser.js) with a Rust axum book API
targets:
- linux/amd64
artifacts:
  linux/amd64:
    path: linux-amd64/ecobook
    sha256: 43b593d65914440ec164b50cff46c04f0b68594227d2b535429da15432207870
    size: 27963464
contract:
  version: 1
  api: ecobook REST API (/api/book, /api/book/:id, /api/book/catalog, /api/ecobook-files/*)
  env:
    required:
    - SERVER_PORT
    - MONGODB_URI
    - JWT_SECRET
    optional:
    - API_BASE_URL
    - CORS_ALLOWED_ORIGINS
    - AUTH_BASE_URL
    - PAYMENTS_BASE_URL
    - COMMUNITY_BASE_URL
    - STORAGE_BACKEND
    - STORAGE_LOCAL_PATH
    - S3_ENDPOINT
    - S3_REGION
    - S3_BUCKET
    - S3_ACCESS_KEY
    - S3_SECRET_KEY
    - RATE_LIMIT_GENERAL_BURST
    - RATE_LIMIT_GENERAL_REPLENISH_SECS
    defaults: {}
  db: mongodb@7
  network:
    inbound:
    - http
    outbound:
    - http
  resources:
    memory: 256m
    disk: 512m
    startup_seconds: 5
runtime:
  base: self-contained-static
  libc: musl
  dependencies: []
provenance:
  source: git@github-getecosphere:ecosphere-creator/ecobook.git
  commit: 3b005135612c1ecbdb4abdfbea155bdf0611ad32
  built_by: eco@0.2.0
  built_at: 2026-08-13T01:16:39Z
  target: x86_64-unknown-linux-musl
release:
- 1.0.0
docs:
- README.md
- api.md
- changelog.md
- examples.sh
- gotchas.md
