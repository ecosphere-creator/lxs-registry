name: email-manager
domain: email-manager
version: 2.1.1
publisher: stuff8
status: unverified
license: mit
summary: 'Email: transactional delivery via Brevo, templates, rate limits, warmup'
targets:
- linux/amd64
artifacts:
  linux/amd64:
    path: linux-amd64/email-manager
    sha256: 95c514998f286a0009ef60fb7f3b7338bf75b9cecdbb29b5efe04cb5d39ced65
    size: 13206408
contract:
  version: 1
  api: email-manager REST API (send + templates + logs)
  env:
    required:
    - SERVER_PORT
    - API_BASE_PATH
    - MONGODB_URI
    - BREVO_API_KEY
    - MAIL_FROM_EMAIL
    - MAIL_FROM_NAME
    optional:
    - EMAIL_PER_RECIPIENT_DAY
    - EMAIL_GLOBAL_PER_HOUR
    - EMAIL_WARMUP_MAX_PER_HOUR
    - EMAIL_WARMUP_DAYS
    defaults: {}
    fields: {}
  db: mongodb@7
  network:
    inbound:
    - http
    outbound:
    - https
  resources:
    memory: 128m
    disk: 256m
    startup_seconds: 5
runtime:
  base: self-contained-static
  libc: musl
  dependencies: []
provenance:
  source: https://github.com/getecosphere/email-manager.git
  commit: 864b858465b49886c838d8e4fbd7583846f9ab17
  built_by: eco@0.4.1
  built_at: 2026-08-20T09:10:43Z
  target: x86_64-unknown-linux-musl
release:
- 2.1.1
docs:
- README.md
- api.md
- changelog.md
- examples.sh
- gotchas.md
- openapi.json
