name: gateway
domain: gateway
version: 3.0.1
publisher: stuff8
status: unverified
license: mit
summary: 'Estate front door: default-deny HTTP reverse-proxy + authorization middleware (JWT, roles, single-session, strip/rewrite) with content-negotiated HTML/JSON error pages'
targets:
- darwin/arm64
- linux/amd64
artifacts:
  linux/amd64:
    path: linux-amd64/gateway
    sha256: 132b270e0f332c97ddef08511cf731916f320a2d0bb554c2197940a385726770
