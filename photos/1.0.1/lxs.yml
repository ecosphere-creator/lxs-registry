name: photos
domain: photos
version: 1.0.1
publisher: stuff8
status: unverified
license: mit
summary: 'Photos & media: uploads, image/video processing, S3 storage, thumbnails'
targets:
- linux/amd64
artifacts:
  linux/amd64:
    path: linux-amd64/photos
    sha256: 5d0c35a7bac2c796b312b0d9de657d6ffc32574ef8d083a39e24496396c1f542
    size: 21228392
contract:
  version: 1
  api: photos REST API (upload + serve + media metadata)
  env:
    required:
    - SERVER_PORT
    - API_BASE_URL
    - S3_ENDPOINT
    - S3_REGION
    - S3_BUCKET
    - S3_ACCESS_KEY
    - S3_SECRET_KEY
    optional:
    - CORS_ALLOWED_ORIGINS
    - MAX_IMAGE_MB
    - MAX_DOCUMENT_MB
    - MAX_IMAGE_PIXELS
    - MAX_VIDEO_MB
    defaults:
      S3_BUCKET: stuff8-storage
  db: none
  network:
    inbound:
    - http
    outbound:
    - s3
  resources:
    memory: 192m
    disk: 1g
    startup_seconds: 5
runtime:
  base: self-contained-static
  libc: musl
  dependencies:
  - ffmpeg
provenance:
  source: git@github.com:kelastanpatembok/photos.git
