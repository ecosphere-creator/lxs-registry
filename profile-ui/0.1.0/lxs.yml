name: profile-ui
domain: profile
version: 0.1.0
publisher: stuff8
status: unverified
license: mit
summary: "White-label profile edit page (name, avatar, cover) for the profile domain (Leptos SSR)"

targets:
  - linux/amd64

artifacts:
  linux/amd64:
    path: linux-amd64/profile-ui
    sha256: fb17ecd84c9d085a580a9525f539d194fdd62706c2ed058f40b6d497ba6fdbd0
    size: 1279296
  darwin/aarch64:
    path: darwin-aarch64/profile-ui
    sha256: 946a118443444be5a8b7c9cc9aa604cd59ac472c70e8de4f69d5c4b079f19faa
    size: 1116368

contract:
  version: 1
  api: "profile-ui pages: GET /profile"
  env:
    required:
      - SERVER_PORT
    optional:
      - PROFILE_API_BASE
      - ECO_SESSION_KEY
  db: "none"
  network:
    inbound: [http]
    outbound: [http]
  resources:
    memory: "32m"
    disk: "32m"
    startup_seconds: 5

runtime:
  base: self-contained-static
  libc: musl
  dependencies: []

provenance:
  source: ""
  commit: ""
  built_by: ""
  built_at: ""
  target: x86_64-unknown-linux-musl

release: []
