name: profile-ui
domain: profile
version: 0.1.0
publisher: stuff8
status: unverified
license: mit
summary: "White-label profile edit page (name, avatar, cover) for the profile domain (Leptos SSR)"

targets:
  - linux/amd64

artifacts: {}

contract:
  version: 1
  api: "profile-ui pages: GET /profile"
  env:
    required:
      - SERVER_PORT
    optional:
      - PROFILE_API_BASE
      - ECO_SESSION_KEY
  db: "none"
  network:
    inbound: [http]
    outbound: [http]
  resources:
    memory: "32m"
    disk: "32m"
    startup_seconds: 5

runtime:
  base: self-contained-static
  libc: musl
  dependencies: []

provenance:
  source: ""
  commit: ""
  built_by: ""
  built_at: ""
  target: x86_64-unknown-linux-musl

release: []
