name: profile-ui
domain: profile
version: 0.1.0
publisher: stuff8
status: unverified
license: mit
summary: "White-label profile edit page (name, avatar, cover) for the profile domain (Leptos SSR)"

targets:
  - linux/amd64

artifacts:
  linux/amd64:
    path: linux-amd64/profile-ui
    sha256: 1be0d0c095624dd9e4470a08f1f2e035c7b5cd72239872744099a02ce3ef73e0
    size: 1280720
  darwin/aarch64:
    path: darwin-aarch64/profile-ui
    sha256: 7c432174b0f86cfc3529239f7fadcff9a5727748b247a4df80d4297eda3b2ed3
    size: 1116384

contract:
  version: 1
  api: "profile-ui pages: GET /profile"
  env:
    required:
      - SERVER_PORT
    optional:
      - PROFILE_API_BASE
      - ECO_SESSION_KEY
  db: "none"
  network:
    inbound: [http]
    outbound: [http]
  resources:
    memory: "32m"
    disk: "32m"
    startup_seconds: 5

runtime:
  base: self-contained-static
  libc: musl
  dependencies: []

provenance:
  source: ""
  commit: ""
  built_by: ""
  built_at: ""
  target: x86_64-unknown-linux-musl

release: []
