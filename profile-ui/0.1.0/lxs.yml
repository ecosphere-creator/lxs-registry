name: profile-ui
domain: profile
version: 0.1.0
publisher: stuff8
status: unverified
license: mit
summary: "White-label profile edit page (name, avatar, cover) for the profile domain (Leptos SSR)"

targets:
  - linux/amd64

artifacts:
  linux/amd64:
    path: linux-amd64/profile-ui
    sha256: 4f89c0afe4cd92b8e73c6f156652170a4d5f95360e741f8fdf634edc775e18a4
    size: 1279344
  darwin/aarch64:
    path: darwin-aarch64/profile-ui
    sha256: b016a990cf711462735a3b8f1bcf182d5667408a8163d6bfd5258343612f27a6
    size: 1116384

contract:
  version: 1
  api: "profile-ui pages: GET /profile"
  env:
    required:
      - SERVER_PORT
    optional:
      - PROFILE_API_BASE
      - ECO_SESSION_KEY
  db: "none"
  network:
    inbound: [http]
    outbound: [http]
  resources:
    memory: "32m"
    disk: "32m"
    startup_seconds: 5

runtime:
  base: self-contained-static
  libc: musl
  dependencies: []

provenance:
  source: ""
  commit: ""
  built_by: ""
  built_at: ""
  target: x86_64-unknown-linux-musl

release: []
