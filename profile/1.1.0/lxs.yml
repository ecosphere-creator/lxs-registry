name: profile
domain: profile
version: 1.1.0
publisher: stuff8
status: unverified
license: mit
summary: "User profiles: bio, experience, education, skills, certifications, links, avatars"

targets:
- linux/amd64
- darwin/aarch64

artifacts:
  linux/amd64:
    path: linux-amd64/profile
    sha256: e0dbd7a736fcd86ea6c5a71790160b19742a28ffb5b74d8c8666c1789950c776
    size: 14196760
  darwin/aarch64:
    path: darwin-aarch64/profile
    sha256: 2505e6f390e060a21b730c16f9b02df6076e1570dfa9faeafe6d65e87316682a
    size: 14354624

contract:
  version: 1
  api: "profile REST API (read/write profile + social links + avatar upload)"
  env:
    required:
      - MONGODB_URI
      - JWT_SECRET
      - SERVER_PORT
      - API_BASE_URL
    optional:
      - CORS_ALLOWED_ORIGINS
      - AUTH_BASE_URL
      - STORAGE_BASE_URL
      - RATE_LIMIT_GENERAL_BURST
      - RATE_LIMIT_GENERAL_REPLENISH_SECS
  db: mongodb@7
  network:
    inbound: [http]
    outbound: [http]
  resources:
    memory: "128m"
    disk: "256m"
    startup_seconds: 5

runtime:
  base: self-contained-static
  libc: musl
  dependencies: []

provenance:
  source: ""
  commit: ""
  built_by: ""
  built_at: ""
  target: x86_64-unknown-linux-musl

release: []
