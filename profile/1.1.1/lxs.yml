name: profile
domain: profile
version: 1.1.1
publisher: stuff8
status: unverified
license: mit
summary: "User profiles: bio, experience, education, skills, certifications, links, avatars"

targets:
  - linux/amd64

artifacts:
  linux/amd64:
    path: linux-amd64/profile
    sha256: 080cd533aa51da0b7a2600b1c3e24cc10700c2844b2e9970e9891f1f7a939fa0
    size: 14199832
  darwin/aarch64:
    path: darwin-aarch64/profile
    sha256: 3978ed9a8f3f49c1dfbcbaae5ba61cbbc4d5d25e21b0036e939233d4245d6f04
    size: 14356032

contract:
  version: 1
  api: "profile REST API (read/write profile + social links + avatar upload)"
  env:
    required:
      - MONGODB_URI
      - JWT_SECRET
      - SERVER_PORT
      - API_BASE_URL
    optional:
      - CORS_ALLOWED_ORIGINS
      - AUTH_BASE_URL
      - STORAGE_BASE_URL
      - RATE_LIMIT_GENERAL_BURST
      - RATE_LIMIT_GENERAL_REPLENISH_SECS
  db: mongodb@7
  network:
    inbound: [http]
    outbound: [http]
  resources:
    memory: "128m"
    disk: "256m"
    startup_seconds: 5

runtime:
  base: self-contained-static
  libc: musl
  dependencies: []

provenance:
  source: ""
  commit: ""
  built_by: ""
  built_at: ""
  target: x86_64-unknown-linux-musl

release: []
