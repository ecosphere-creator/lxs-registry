name: registry
domain: registry
version: 1.0.1
publisher: getecosphere
status: unverified
license: mit
summary: LXS Registry — browse and categorize versioned Linux Services from the getecosphere/lxs-registry repository
targets:
- linux/amd64
artifacts:
  linux/amd64:
    path: linux-amd64/registry
    sha256: eba1667318f5830076a09e81304d487b12528890aecd480994732ef71469a7c8
    size: 4615408
contract:
  version: 1
  api: registry REST API (/api/lxs, /api/lxs/categories, /api/lxs/:name)
  env:
    required:
    - SERVER_PORT
    - LXS_REGISTRY_CACHE
    optional:
    - PORT
    defaults: {}
  db: none
  network:
    inbound:
    - http
    outbound:
    - https
  resources:
    memory: 128m
    disk: 512m
    startup_seconds: 10
runtime:
  base: self-contained-static
  libc: musl
  dependencies:
  - git
provenance:
  source: git@github-getecosphere:getecosphere/registry.git
  commit: c5227f46899a56f17bf09b875bd95f04a301617c
  built_by: eco@0.2.0
  built_at: 2026-08-13T01:08:18Z
  target: x86_64-unknown-linux-musl
release:
- 1.0.1
docs:
- README.md
- api.md
- changelog.md
- examples.sh
- gotchas.md
- openapi.json
