name: storage
domain: storage
version: 1.0.0
publisher: stuff8
status: unverified
license: mit
summary: 'Photos & media: uploads, image/video processing, S3 storage, thumbnails'
category: Media
targets:
- linux/amd64
artifacts:
  linux/amd64:
    path: linux-amd64/storage
    sha256: 46c9119d186c7ac7d150f9b79955cb76de8d18ef43ec16aead1baa4f2355fb5e
    size: 21228488
contract:
  version: 1
  api: photos REST API (upload + serve + media metadata)
  env:
    required:
    - SERVER_PORT
    - API_BASE_URL
    - S3_ENDPOINT
    - S3_REGION
    - S3_BUCKET
    - S3_ACCESS_KEY
    - S3_SECRET_KEY
    optional:
    - CORS_ALLOWED_ORIGINS
    - MAX_IMAGE_MB
    - MAX_DOCUMENT_MB
    - MAX_IMAGE_PIXELS
    - MAX_VIDEO_MB
    defaults:
      S3_BUCKET: stuff8-storage
  db: none
  network:
    inbound:
    - http
    outbound:
    - s3
  resources:
    memory: 192m
    disk: 1g
    startup_seconds: 5
runtime:
  base: self-contained-static
  libc: musl
  dependencies:
  - ffmpeg
provenance:
  source: https://github.com/getecosphere/storage.git
  commit: 600926e6
  built_by: eco@0.2.0
  built_at: 2026-08-11T23:11:10Z
  target: x86_64-unknown-linux-musl
release:
- 1.0.0
