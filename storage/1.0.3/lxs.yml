name: storage
domain: storage
version: 1.0.3
publisher: stuff8
status: unverified
license: mit
summary: 'Photos & media: uploads, image/video processing, S3 storage, thumbnails'
targets:
- linux/amd64
artifacts:
  linux/amd64:
    path: linux-amd64/storage
    sha256: df2166eda763efe57c9390907edb7a221370a7b1ebe782309262248e9e832a93
    size: 21228416
contract:
  version: 1
  api: photos REST API (upload + serve + media metadata)
  env:
    required:
    - SERVER_PORT
    - API_BASE_URL
    - S3_ENDPOINT
    - S3_REGION
    - S3_BUCKET
    - S3_ACCESS_KEY
    - S3_SECRET_KEY
    optional:
    - CORS_ALLOWED_ORIGINS
    - MAX_IMAGE_MB
    - MAX_DOCUMENT_MB
    - MAX_IMAGE_PIXELS
    - MAX_VIDEO_MB
    defaults:
      S3_BUCKET: stuff8-storage
  db: none
  network:
    inbound:
    - http
    outbound:
    - s3
  resources:
    memory: 192m
    disk: 1g
    startup_seconds: 5
runtime:
  base: self-contained-static
  libc: musl
  dependencies:
  - ffmpeg
provenance:
  source: https://github.com/getecosphere/storage.git
  commit: 69fea78182bb842573b454bb80270a958fdcdc50
  built_by: eco@0.2.0
  built_at: 2026-08-12T11:02:26Z
  target: x86_64-unknown-linux-musl
release:
- 1.0.3
