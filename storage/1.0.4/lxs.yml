name: storage
domain: storage
version: 1.0.4
publisher: stuff8
status: unverified
license: mit
summary: 'Photos & media: uploads, image/video processing, S3 storage, thumbnails'
targets:
- linux/amd64
artifacts:
  linux/amd64:
    path: linux-amd64/storage
    sha256: f874f8ec2e0323f9f575f3f555c04b6749b2c2c23d232f1e0f537b684ce719ae
    size: 21228736
contract:
  version: 1
  api: photos REST API (upload + serve + media metadata)
  env:
    required:
    - SERVER_PORT
    - API_BASE_URL
    - S3_ENDPOINT
    - S3_REGION
    - S3_BUCKET
    - S3_ACCESS_KEY
    - S3_SECRET_KEY
    optional:
    - CORS_ALLOWED_ORIGINS
    - MAX_IMAGE_MB
    - MAX_DOCUMENT_MB
    - MAX_IMAGE_PIXELS
    - MAX_VIDEO_MB
    defaults:
      S3_BUCKET: stuff8-storage
  db: none
  network:
    inbound:
    - http
    outbound:
    - s3
  resources:
    memory: 192m
    disk: 1g
    startup_seconds: 5
runtime:
  base: self-contained-static
  libc: musl
  dependencies:
  - ffmpeg
provenance:
  source: git@github.com:kelastanpatembok/storage.git
  commit: 455513dc45cdc684d4758efe57e3a44367bd34f4
  built_by: eco@0.2.0
  built_at: 2026-08-12T11:07:05Z
  target: x86_64-unknown-linux-musl
release:
- 1.0.4
