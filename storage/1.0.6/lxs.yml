name: storage
domain: storage
version: 1.0.6
publisher: stuff8
status: unverified
license: mit
summary: 'Photos & media: uploads, image/video processing, S3 storage, thumbnails'
targets:
- linux/amd64
artifacts:
  linux/amd64:
    path: linux-amd64/storage
    sha256: 5185fc2760463b3420f1dde447be0216d612068c53de9155fd9f63f4215fcfd4
    size: 21191464
  darwin/aarch64:
    path: darwin-aarch64/storage
    sha256: 4ce67c8ec16bbae646345f4741125b432e168348a82b8aeb9808c6ae73d57775
    size: 25434880
contract:
  version: 1
  api: photos REST API (upload + serve + media metadata)
  env:
    required:
    - SERVER_PORT
    - API_BASE_URL
    - S3_ENDPOINT
    - S3_REGION
    - S3_BUCKET
    - S3_ACCESS_KEY
    - S3_SECRET_KEY
    optional:
    - CORS_ALLOWED_ORIGINS
    - MAX_IMAGE_MB
    - MAX_DOCUMENT_MB
    - MAX_IMAGE_PIXELS
    - MAX_VIDEO_MB
    defaults:
      S3_BUCKET: stuff8-storage
  db: none
  network:
    inbound:
    - http
    outbound:
    - s3
  resources:
    memory: 192m
    disk: 1g
    startup_seconds: 5
runtime:
  base: self-contained-static
  libc: musl
  dependencies:
  - ffmpeg
provenance:
  source: https://github.com/getecosphere/storage.git
  commit: b87c450a07937a9f75ee68773ca1471c9f9b4423
  built_by: eco@0.2.0
  built_at: 2026-08-13T00:57:22Z
  target: x86_64-unknown-linux-musl
release:
- 1.0.5
docs:
- README.md
- api.md
- changelog.md
- examples.sh
- gotchas.md
- openapi.json
