  api: photos REST API (upload + serve + media metadata)
  env:
    required:
    - SERVER_PORT
    - API_BASE_URL
    - S3_ENDPOINT
    - S3_REGION
    - S3_BUCKET
    - S3_ACCESS_KEY
    - S3_SECRET_KEY
