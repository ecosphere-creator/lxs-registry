name: storage
domain: storage
version: 2.0.0
publisher: stuff8
status: unverified
license: mit
summary: 'Photos & media: uploads, image/video processing, S3 storage, thumbnails'
targets:
- darwin/arm64
- linux/amd64
artifacts:
  darwin/arm64:
    path: darwin-arm64/storage
    sha256: 8a2fbf635f2106faae40f37f6a68a287b883d11d6abdda37e9e158bcec747a6a
    size: 25575632
  linux/amd64:
    path: linux-amd64/storage
    sha256: 83889b67f4bca189c4e68f372ce13b03757faa5f49372963c84dfceceb2972cd
    size: 21327376
contract:
  version: 1
  api: photos REST API (upload + serve + media metadata)
  env:
    required:
    - SERVER_PORT
    - API_BASE_URL
    - S3_ENDPOINT
    - S3_REGION
    - S3_BUCKET
    - S3_ACCESS_KEY
    - S3_SECRET_KEY
    optional:
    - CORS_ALLOWED_ORIGINS
    - MAX_IMAGE_MB
    - MAX_DOCUMENT_MB
    - MAX_IMAGE_PIXELS
    - MAX_VIDEO_MB
    defaults:
      S3_BUCKET: stuff8-storage
  db: none
  network:
    inbound:
    - http
    outbound:
    - s3
  resources:
    memory: 192m
    disk: 1g
    startup_seconds: 5
runtime:
  base: self-contained-static
  libc: musl
  dependencies:
  - ffmpeg
provenance:
  source: https://github.com/getecosphere/storage.git
  commit: 383cfa0de5e63e532787cfb7adadf038c2d58f1b
  built_by: eco@0.4.1
  built_at: 2026-08-19T04:06:22Z
  target: x86_64-unknown-linux-musl
release:
- 2.0.0
docs:
- README.md
- api.md
- changelog.md
- examples.sh
- gotchas.md
- openapi.json
